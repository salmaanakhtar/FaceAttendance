name: Publish FaceAttendance APK

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged build
        uses: actions/checkout@v4

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FaceAttendance ${{ github.ref_name }}
          generate_release_notes: true
          files: app/releases/FaceAttendance-${{ github.ref_name }}-lan.apk
