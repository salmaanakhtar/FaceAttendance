name: face_attendance
description: "FaceAttendance — facial check-in/check-out kiosk for employees."
publish_to: 'none'
version: 1.1.2+4

environment:
  sdk: '>=3.4.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  camera: ^0.10.6
  google_mlkit_face_detection: ^0.11.0
  onnxruntime: ^1.4.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  flutter_secure_storage: ^9.0.0
  dio: ^5.4.3
  connectivity_plus: ^6.0.3
  intl: ^0.19.0
  uuid: ^4.4.0
  crypto: ^3.0.3
  encrypt: ^5.0.3
  share_plus: 7.2.2
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/w600k_mbf.onnx
