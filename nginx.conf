server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  add_header Content-Security-Policy "default-src 'self'; connect-src https://faceattendance-api.salmaan.dev; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /health {
    access_log off;
    default_type application/json;
    return 200 '{"ok":true,"service":"faceattendance-web-admin"}';
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
